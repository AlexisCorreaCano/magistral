title = "magistral secret scanning"

# Use gitleaks' default ruleset as a starting point.
[extend]
useDefault = true

# Allowlist for paths and values that legitimately reference fake keys, examples, or docs.
[[allowlists]]
description = "Test fixtures, examples, and documentation may reference placeholder keys"
paths = [
  '''(^|/)test/.*''',
  '''(^|/)integration_test/.*''',
  '''(^|/)example/.*''',
  '''(^|/)docs/.*''',
  '''(?i).*\.(md|markdown)$''',
  '''README\.md$''',
  '''CHANGELOG\.md$''',
  '''SECURITY\.md$''',
  '''CONTRIBUTING\.md$''',
  '''CODEOWNERS$''',
  '''LICENSE$''',
]
regexes = [
  '''(?i)(example|placeholder|dummy|fake|test|sample|your[-_]?(token|key|secret|password|app[-_]?id))[-_]?(token|key|secret|password)?''',
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
]
