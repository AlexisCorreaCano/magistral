title = "magistral secret scanning"

# Use gitleaks' default ruleset as a starting point.
[extend]
useDefault = true

# Allowlist for paths that legitimately reference fake keys, examples, or docs.
[[allowlists]]
description = "Test fixtures, examples, and documentation"
target_rules = [
  "generic-api-key",
  "gitlab-pat",
  "github-pat",
  "aws-access-token",
  "stripe-access-token",
  "slack-bot-token",
  "private-key",
]
paths = [
  '''(^|/)test/.*''',
  '''(^|/)integration_test/.*''',
  '''(^|/)example/.*''',
  '''(^|/)docs/.*''',
  '''(^|/)README\.md$''',
  '''(?i).*\.(md|markdown)$''',
]

  # Obvious placeholder values that should never trigger.
  [[allowlists.regexes]]
  description = "Allow obviously-fake placeholder values"
  regex = '''(?i)(example|placeholder|dummy|fake|test|sample|your[-_]?(token|key|secret|password|app[-_]?id))'''
